name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  stub:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C stub
      - uses: actions/upload-artifact@v7
        with:
          name: stub
          path: stub/stub.elf

  dist:
    needs: stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stub
          path: src/shortcut3ds/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: unzip -l dist/*.whl | grep -q "shortcut3ds/data/stub.elf"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "shortcut3ds ${{ github.ref_name }}" --generate-notes dist/*
